spring:
  datasource:
    url: jdbc:mysql://localhost:3306/future_community?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.futurecommunity.model

server:
  port: ${SERVER_PORT:8080}

upload:
  path: ./upload
  images: ./upload/images
  alarm-image-path: ./upload/monitor

jwt:
  secret: ${JWT_SECRET:futurecommunitysecretkey1234567890}
  expiration: 86400000

baidu:
  ai:
    appId: ${BAIDU_AI_APP_ID:your-baidu-app-id}
    apiKey: ${BAIDU_AI_API_KEY:your-baidu-api-key}
    secretKey: ${BAIDU_AI_SECRET_KEY:your-baidu-secret-key}

# 行为识别检测参数配置
detection:
  interval-ms: 1000              # 前端采帧间隔（毫秒）
  fighting-iou-threshold: 0.1    # 打架判断 IoU 阈值
  min-confidence: 0.6            # 最低置信度过滤

glm:
  api-key: ${GLM_API_KEY:your-glm-api-key}
  base-url: https://open.bigmodel.cn/api/paas/v4
  model: glm-4v-flash  # 使用 glm-4v-flash 模型（支持图片理解）

# ===== 模型预置配置 =====
model-preset:
  current: ORIGINAL  # ORIGINAL / ECONOMY / PREMIUM
  qwen-vl:
    api-key: ${QWEN_VL_API_KEY:your-qwen-api-key}
    model: qwen-vl-max
    base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  gemini:
    api-key: ${GEMINI_API_KEY:your-gemini-api-key}
    model: gemini-2.5-flash
    base-url: https://generativelanguage.googleapis.com/v1beta
  yolo:
    service-url: http://localhost:5000
    enabled: false
