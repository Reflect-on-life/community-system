<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 识别测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .image-preview {
            max-width: 100%;
            margin: 20px 0;
        }
        .result {
            background: #fff;
            padding: 15px;
            margin: 15px 0;
            border-radius: 4px;
            border-left: 4px solid #1890ff;
        }
        .high-risk {
            border-left-color: #ff4d4f;
            background: #fff1f0;
        }
        .medium-risk {
            border-left-color: #faad14;
            background: #fffbe6;
        }
        button {
            background: #1890ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #40a9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>AI 风险识别测试</h1>
        
        <div>
            <h3>测试图片：老人摔倒</h3>
            <img src="monitor/ScreenShot_2026-02-23_103602_641.png" alt="测试图片" class="image-preview" />
        </div>
        
        <button onclick="testRecognition()">开始 AI 识别</button>
        
        <div id="result" style="display: none;">
            <h3>识别结果：</h3>
            <div id="resultContent"></div>
        </div>
    </div>
    
    <script>
        async function testRecognition() {
            const resultDiv = document.getElementById('result');
            const resultContent = document.getElementById('resultContent');
            
            try {
                // Step 1: Upload image
                const fileInput = document.createElement('input');
                fileInput.type = 'file';
                fileInput.accept = 'image/*';
                
                // For testing, we'll use the image URL directly
                const imageUrl = 'http://localhost:8080/upload/images/test.png';
                
                // Step 2: Call AI recognition
                const response = await fetch('http://localhost:8080/api/risk/recognize', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        imageUrl: imageUrl
                    })
                });
                
                const result = await response.json();
                
                // Display result
                resultDiv.style.display = 'block';
                
                let riskClass = '';
                if (result.riskLevel === 'HIGH') {
                    riskClass = 'high-risk';
                } else if (result.riskLevel === 'MEDIUM') {
                    riskClass = 'medium-risk';
                }
                
                resultContent.className = riskClass;
                resultContent.innerHTML = `
                    <p><strong>风险类型：</strong>${result.riskType}</p>
                    <p><strong>风险等级：</strong>${result.riskLevel}</p>
                `;
                
            } catch (error) {
                console.error('Error:', error);
                resultDiv.style.display = 'block';
                resultContent.innerHTML = `<p style="color: red;">识别失败：${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
